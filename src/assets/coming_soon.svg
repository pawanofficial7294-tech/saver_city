<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b241d" />
      <stop offset="50%" stop-color="#051712" />
      <stop offset="100%" stop-color="#020c08" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#f3e5ab" />
      <stop offset="100%" stop-color="#aa7c11" />
    </linearGradient>

    <!-- Emerald Glow Gradient -->
    <radialGradient id="emeraldGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Card Inner Glow -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="plotGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.07" />
      <circle cx="60" cy="60" r="1.5" fill="#10b981" fill-opacity="0.15" />
    </pattern>
  </defs>

  <!-- Base Dark Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)" />

  <!-- Plot Grid Overlay -->
  <rect width="1200" height="800" fill="url(#plotGrid)" />

  <!-- Center Ambient Radial Glow -->
  <circle cx="600" cy="400" r="500" fill="url(#emeraldGlow)" />

  <!-- Decorative Abstract Land / Architecture Curves -->
  <path d="M-100 650 Q 300 450 600 550 T 1300 480 L 1300 900 L -100 900 Z" fill="#041f17" fill-opacity="0.6" />
  <path d="M-100 700 Q 400 520 800 620 T 1300 560 L 1300 900 L -100 900 Z" fill="#02140e" fill-opacity="0.8" />

  <!-- Isometric Land Plot Blueprint Lines -->
  <g stroke="#d4af37" stroke-width="1.2" stroke-opacity="0.25" fill="none">
    <polygon points="600,180 850,300 600,420 350,300" />
    <polygon points="600,210 800,300 600,390 400,300" stroke-dasharray="4 4" />
    <line x1="600" y1="180" x2="600" y2="420" />
    <line x1="350" y1="300" x2="850" y2="300" />
  </g>

  <!-- Glassmorphism Banner Box -->
  <rect x="250" y="220" width="700" height="360" rx="24" fill="#061c16" fill-opacity="0.75" stroke="url(#glassBorder)" stroke-width="2" />
  
  <!-- Outer Decorative Corner Accents -->
  <path d="M 270 260 L 270 240 L 290 240" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  <path d="M 930 260 L 930 240 L 910 240" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  <path d="M 270 540 L 270 560 L 290 560" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  <path d="M 930 540 L 930 560 L 910 560" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />

  <!-- Top Pill Badge -->
  <g transform="translate(600, 275)">
    <rect x="-110" y="-18" width="220" height="36" rx="18" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5" />
    <!-- Pin Icon -->
    <path d="M-80 -2 C-80 -7 -76 -10 -71 -10 C-66 -10 -62 -7 -62 -2 C-62 4 -71 10 -71 10 C-71 10 -80 4 -80 -2 Z" fill="none" stroke="#10b981" stroke-width="2" />
    <circle cx="-71" cy="-2" r="2" fill="#10b981" />
    <text x="-48" y="5" font-family="'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#34d399" letter-spacing="2">SAVERA CITY</text>
  </g>

  <!-- Main Title: COMING SOON -->
  <text x="600" y="380" font-family="'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="6">
    COMING SOON
  </text>

  <!-- Decorative Separator Line with Sparkle -->
  <g transform="translate(600, 415)">
    <line x1="-180" y1="0" x2="-20" y2="0" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6" />
    <polygon points="0,-7 5,-2 12,0 5,2 0,7 -5,2 -12,0 -5,-2" fill="#f3e5ab" />
    <line x1="20" y1="0" x2="180" y2="0" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6" />
  </g>

  <!-- Subtitle -->
  <text x="600" y="465" font-family="'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#e2e8f0" text-anchor="middle" letter-spacing="3">
    NEW TOWNSHIP LAUNCHING SOON
  </text>

  <!-- Bottom Tagline -->
  <text x="600" y="510" font-family="'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="1">
    Pre-Registration &amp; VIP Inquiries Open
  </text>
</svg>
